<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="画伞 huasan — Build in Public">
  <title>画伞 huasan</title>
  <desc>Dots connecting into a line — visualizing build in public.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1a26"/>
      <stop offset="100%" stop-color="#252333"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8478d9" stop-opacity="0.7"/>
      <stop offset="60%"  stop-color="#8478d9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8478d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="umbrellaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a6dd0"/>
      <stop offset="100%" stop-color="#4a3f9d"/>
    </linearGradient>

    <style><![CDATA[
      @keyframes fadeUp {
        0%   { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        0%   { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes scaleIn {
        0%   { opacity: 0; transform: scale(0.2); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes drawLine {
        0%   { stroke-dashoffset: 900; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blink {
        0%, 49%   { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50%      { opacity: 0.95; transform: scale(1.25); }
      }

      .d-1 { animation: scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) 0.0s backwards; transform-origin: 200px 130px; }
      .d-2 { animation: scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) 0.12s backwards; transform-origin: 300px 130px; }
      .d-3 { animation: scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) 0.24s backwards; transform-origin: 400px 130px; }
      .d-4 { animation: scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) 0.36s backwards; transform-origin: 500px 130px; }
      .d-5 { animation: scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) 0.48s backwards; transform-origin: 600px 130px; }
      .d-6 { animation: scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) 0.60s backwards; transform-origin: 700px 130px; }
      .d-7 { animation: scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) 0.72s backwards; transform-origin: 800px 130px; }
      .d-8 { animation: scaleIn 0.4s cubic-bezier(0.16,1,0.3,1) 0.84s backwards; transform-origin: 900px 130px; }
      .d-big {
        animation: scaleIn 0.6s cubic-bezier(0.16,1,0.3,1) 1.0s backwards;
        transform-origin: 1000px 130px;
      }
      .d-glow {
        transform-origin: 1000px 130px;
        animation: fadeIn 0.6s ease 1.3s backwards,
                   pulse 2.4s ease-in-out 1.8s infinite;
      }

      .timeline {
        stroke-dasharray: 900;
        animation: drawLine 1.2s cubic-bezier(0.25,0.46,0.45,0.94) 0.9s backwards;
      }

      .umbrella-mini {
        animation: fadeUp 1.0s cubic-bezier(0.16,1,0.3,1) 2.1s backwards;
      }
      .title-main { animation: fadeUp 1.0s cubic-bezier(0.16,1,0.3,1) 2.1s backwards; }
      .title-line {
        stroke-dasharray: 120;
        animation: drawLine 0.8s cubic-bezier(0.25,0.46,0.45,0.94) 2.5s backwards;
      }
      .title-sub  { animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 2.8s backwards; }
      .cursor {
        animation: fadeIn 0.3s ease 3.0s backwards,
                   blink 1s steps(1) 3.4s infinite;
      }
      .signature { animation: fadeIn 0.8s ease 3.4s backwards; }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="1160" height="340" rx="20" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- 8 个小点（左→右逐渐变色） + 1 个大点（终点） -->
  <circle class="d-1" cx="200"  cy="130" r="4" fill="rgba(255,255,255,0.25)"/>
  <circle class="d-2" cx="300"  cy="130" r="4" fill="rgba(255,255,255,0.32)"/>
  <circle class="d-3" cx="400"  cy="130" r="4" fill="rgba(255,255,255,0.42)"/>
  <circle class="d-4" cx="500"  cy="130" r="5" fill="rgba(255,255,255,0.55)"/>
  <circle class="d-5" cx="600"  cy="130" r="5" fill="#a8a3d8"/>
  <circle class="d-6" cx="700"  cy="130" r="6" fill="#8478d9"/>
  <circle class="d-7" cx="800"  cy="130" r="6" fill="#8478d9"/>
  <circle class="d-8" cx="900"  cy="130" r="7" fill="#7a6dd0"/>

  <!-- 大终点：发光 + pulse -->
  <circle class="d-glow" cx="1000" cy="130" r="36" fill="url(#dotGlow)"/>
  <circle class="d-big"  cx="1000" cy="130" r="13" fill="#8478d9" stroke="#c4bdef" stroke-width="2"/>

  <!-- Timeline -->
  <line class="timeline" x1="180" y1="180" x2="1020" y2="180"
        stroke="rgba(132,120,217,0.45)" stroke-width="2" stroke-linecap="round"/>

  <!-- "每天一个点，连成线" 极小说明 -->
  <text font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10"
        fill="rgba(255,255,255,0.35)" letter-spacing="3">
    <tspan class="signature" x="200" y="205">DAY 001</tspan>
    <tspan class="signature" x="1000" y="205" text-anchor="middle">TODAY</tspan>
  </text>

  <!-- 小伞 icon（直接复制 logo-D 的伞，scale 0.32，translate 到画伞左侧；钩子镜像朝左） -->
  <g class="umbrella-mini">
    <g transform="translate(10, 208) scale(0.38)">
      <!-- Canopy -->
      <path d="M 175,170 A 115,85 0 0 1 405,170 Z"
            fill="url(#umbrellaGrad)" stroke="#8478d9" stroke-width="1.5"/>
      <!-- Ribs -->
      <line x1="290" y1="83" x2="180" y2="168" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>
      <line x1="290" y1="83" x2="237" y2="168" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>
      <line x1="290" y1="83" x2="290" y2="168" stroke="rgba(255,255,255,0.4)"  stroke-width="1"/>
      <line x1="290" y1="83" x2="343" y2="168" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>
      <line x1="290" y1="83" x2="400" y2="168" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>
      <!-- Top tip -->
      <circle cx="290" cy="80" r="4" fill="#8478d9"/>
      <!-- Bottom inner shadow -->
      <path d="M 178,170 Q 233,180 290,178 Q 347,180 402,170"
            fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="1.5"/>
      <!-- Pole -->
      <line x1="290" y1="170" x2="290" y2="250" stroke="#5b4fb5" stroke-width="3" stroke-linecap="round"/>
      <!-- Handle hook（朝左弯，弧度比原版稍大） -->
      <path d="M 290,250 Q 290,286 266,286 Q 254,286 254,280"
            fill="none" stroke="#5b4fb5" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 主标 -->
  <g class="title-main">
    <text x="200" y="280" font-size="56" font-weight="700" fill="#fff"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">画伞 · huasan<tspan class="cursor" fill="#8478d9" dx="6">_</tspan></text>
  </g>

  <!-- 分隔短线 -->
  <line class="title-line" x1="200" y1="296" x2="320" y2="296"
        stroke="#8478d9" stroke-width="2" stroke-linecap="round"/>

  <!-- 副标 -->
  <text class="title-sub" x="200" y="324" font-size="15"
        fill="rgba(255,255,255,0.65)"
        font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">每天一个点，连成一条线 · Build in public</text>

  <!-- 角落签名 -->
  <text class="signature" x="1140" y="336" text-anchor="end" font-size="11"
        fill="rgba(255,255,255,0.4)" letter-spacing="2"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace">AI + OPC LAB</text>
</svg>
